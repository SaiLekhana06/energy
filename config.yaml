# ==============================================================================
# Energy-Aware Multi-Agent DRL for Dynamic Slicing & xApp Sleeping in O-RAN
# Master Configuration File
# Academic Context: Minor Project-II, ECE Department, Vel Tech R&D Institute
# ==============================================================================

project:
  name: "oran_energy_slicing_marl"
  title: "Energy-Aware Multi-Agent DRL for Dynamic Network Slicing and xApp Sleeping in O-RAN"
  version: "1.0.0"
  random_seed: 42

simulation:
  time_step_duration_ms: 100        # Scheduling decision interval (100 ms per TTI block / Near-RT RIC loop)
  episode_length_steps: 100         # 100 steps = 10 seconds of simulated network activity per episode
  total_prbs: 100                   # Total Physical Resource Blocks (e.g., 20 MHz 5G NR carrier with 15/30 kHz SCS)
  min_prb_per_slice: 5              # Minimum guaranteed PRB reservation per slice to prevent complete starvation
  num_cells: 3                      # Number of gNB cells / sectors controlled by Near-RT RIC
  max_ue_per_slice:
    embb: 30
    urllc: 20
    mmtc: 150

traffic:
  # Peak traffic rate in Mbps or packets/sec
  embb:
    mean_rate_mbps: 65.0
    burst_probability: 0.15
    burst_multiplier: 1.8
    diurnal_phase_offset: 0.0       # Sinusoidal diurnal fluctuation phase
  urllc:
    mean_rate_mbps: 12.0
    burst_probability: 0.25
    burst_multiplier: 2.5
    arrival_mode: "poisson"         # Poisson distributed packet arrivals
  mmtc:
    mean_rate_mbps: 8.0
    device_active_ratio: 0.4
    burst_probability: 0.05
    burst_multiplier: 1.5

sla:
  embb:
    min_throughput_mbps: 45.0       # Minimum aggregate throughput required
    max_latency_ms: 25.0            # Delay limit
  urllc:
    min_throughput_mbps: 10.0       # Reliability bandwidth
    max_latency_ms: 5.0             # Strict ultra-low latency threshold (<= 5 ms)
    target_reliability: 0.99999     # 99.999% reliability target
  mmtc:
    min_throughput_mbps: 6.0        # Sensor aggregation throughput
    max_latency_ms: 80.0            # Tolerable queueing delay

energy:
  # Base station (gNodeB) radio sub-system power components (Watts)
  p_base_watts: 180.0               # Base consumption (power supply, digital baseband processing, cooling)
  p_rf_active_watts: 120.0          # Active RF power amplifier and transceiver circuitry per cell
  p_rf_light_sleep_watts: 40.0      # Light micro-sleep (DTX: fast wake-up 10 ms, partial sleep)
  p_rf_deep_sleep_watts: 8.0        # Deep sleep (slow wake-up 100 ms, near-zero RF power)
  
  # Near-RT RIC software xApps computing power (Watts)
  # Controlled xApps: [Beamforming Opt xApp, ML Traffic Predictor xApp, High-Order Mod xApp]
  p_xapp_active_watts: 45.0         # Full CPU/GPU container processing
  p_xapp_light_sleep_watts: 15.0    # Container throttled / low power state
  p_xapp_deep_sleep_watts: 3.0      # Container suspended / checkpointed
  
  # State transition costs (Joules)
  transition_energy_wake_joules: 15.0   # Transient surge when waking up from deep sleep
  transition_delay_steps: 1             # 1 decision step transition penalty if waking from deep sleep

channel:
  carrier_frequency_ghz: 3.5        # 5G Sub-6 GHz Band (n78)
  bandwidth_mhz: 20.0               # 20 MHz bandwidth
  noise_figure_db: 7.0
  thermal_noise_density_dbm: -174.0 # dBm/Hz
  path_loss_exponent: 3.5
  shadowing_std_db: 4.0

rewards:
  w_qos: 1.0                        # Weight for throughput satisfaction
  w_energy: 1.2                     # Weight for normalized energy consumption reduction
  w_sla: 2.5                        # Penalty weight for SLA violations
  w_trans: 0.3                      # Penalty for frequent sleep/wake state toggling
  w_util: 0.5                       # Reward for efficient PRB capacity utilization

training:
  algorithm: "MAPPO"                # Multi-Agent Proximal Policy Optimization (CTDE)
  episodes: 250                     # Default computationally manageable for standard student laptop
  steps_per_episode: 100
  batch_size: 64
  mini_epochs: 5
  lr_actor: 0.0003
  lr_critic: 0.001
  gamma: 0.99                       # Discount factor
  gae_lambda: 0.95                  # Generalized Advantage Estimation parameter
  clip_eps: 0.2                     # PPO clipping parameter
  entropy_coef: 0.01                # Exploration entropy coefficient
  max_grad_norm: 0.5
  checkpoint_interval: 50
  hidden_dim: 128

baselines:
  static_allocation:
    embb_prbs: 50
    urllc_prbs: 30
    mmtc_prbs: 20
  greedy_energy:
    traffic_threshold_mbps: 35.0    # Switch to sleep if aggregate load is below this value
    high_load_threshold_mbps: 70.0  # Force active if load exceeds this value
  evaluation_episodes: 20
  eval_seeds: [42, 101, 2024, 777, 999]

paths:
  checkpoints_dir: "./checkpoints"
  results_dir: "./results"
  plots_dir: "./results/plots"
